<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People Development Framework</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #f6f3ee;
      --card:        #ffffff;
      --ink:         #1c1a18;
      --text:        #2b2825;
      --text-muted:  #6f6a64;
      --text-faint:  #c2bdb6;
      --border:      #e6e1da;
      --border-btn:  #e2ddd6;
      --track:       #e4e0da;
      --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
      --sans:  'DM Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 16px 80px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-family: var(--serif);
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    .header p {
      font-size: 17px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .header-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      padding: 15px 28px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn svg { width: 20px; height: 20px; }

    .btn-primary {
      background: var(--ink);
      border: 1.5px solid var(--ink);
      color: #fff;
    }

    .btn-primary:hover { background: #3a3632; border-color: #3a3632; }

    .btn-ghost {
      background: transparent;
      border: 1.5px solid var(--border-btn);
      color: var(--text-muted);
    }

    .btn-ghost:hover { background: var(--card); color: var(--ink); }

    /* Name field */
    .name-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
    }

    .name-card label {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .name-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 17px;
      color: var(--ink);
      outline: none;
    }

    .name-input::placeholder { color: var(--text-faint); }

    /* Progress */
    .progress {
      margin: 26px 0 32px;
    }

    .progress-track {
      height: 5px;
      background: var(--track);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--ink);
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    .progress-count {
      text-align: right;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }

    /* Categories */
    .framework {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .category {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 34px 36px 26px;
    }

    .category-eyebrow {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .category h2 {
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 8px;
      line-height: 1.2;
    }

    .competencies {
      margin-top: 18px;
    }

    .competency {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 0;
      border-top: 1px solid var(--border);
    }

    .competency-label {
      flex: 1;
      font-size: 16.5px;
      color: var(--text);
      line-height: 1.4;
    }

    .rating-buttons {
      display: grid;
      grid-template-columns: repeat(3, 108px);
      gap: 10px;
      flex-shrink: 0;
    }

    .rating-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 2px solid var(--border-btn);
      border-radius: 12px;
      padding: 12px 6px 11px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .rating-btn svg {
      width: 18px;
      height: 18px;
      color: var(--ink);
    }

    .rating-btn:hover:not(.active) { border-color: #c9c3bb; }

    .rating-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .rating-btn.active svg { color: #fff; }

    .rating-btn:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    @media (max-width: 640px) {
      .page { padding-top: 40px; }
      .header p { font-size: 15px; }
      .category { padding: 26px 20px 18px; border-radius: 16px; }
      .category h2 { font-size: 23px; }
      .competency { flex-direction: column; align-items: stretch; gap: 12px; }
      .rating-buttons { grid-template-columns: repeat(3, 1fr); }
      .name-card { padding: 16px 18px; }
    }

    .print-legend { display: none; }

    /* ── Print / Export PDF: one A4 landscape page ── */
    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      body {
        background: var(--bg) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page { max-width: none; padding: 0; }

      .header-actions,
      .name-card,
      .progress,
      .header p { display: none; }

      .header { margin-bottom: 12px; }

      .header h1 { font-size: 24px; }

      .header h1::after {
        content: attr(data-name);
        display: block;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-top: 3px;
      }

      .print-legend {
        display: flex;
        justify-content: center;
        gap: 18px;
        margin-top: 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .print-legend span { display: inline-flex; align-items: center; gap: 5px; }

      .print-legend svg { width: 11px; height: 11px; color: var(--ink); }

      .framework {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .category {
        padding: 14px 16px 8px;
        border-radius: 8px;
        break-inside: avoid;
      }

      .category-eyebrow { font-size: 8px; letter-spacing: 1.4px; }

      .category h2 { font-size: 17px; margin-top: 3px; }

      .competencies { margin-top: 8px; }

      .competency { gap: 10px; padding: 6px 0; }

      .competency-label { font-size: 11px; line-height: 1.3; }

      .rating-buttons { grid-template-columns: repeat(3, 26px); gap: 4px; }

      .rating-btn {
        padding: 4px 0;
        border-width: 1px;
        border-radius: 5px;
        gap: 0;
        font-size: 0;
        letter-spacing: 0;
      }

      .rating-btn svg { width: 11px; height: 11px; }
    }
  </style>
</head>
<body>

  <main class="page">
    <header class="header">
      <h1 id="pageTitle" data-name="">People Development Framework</h1>
      <p>Rate each competency as you see it today — Low, Medium or High.</p>
      <div class="header-actions">
        <button class="btn btn-primary" id="exportBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12" /><path d="M7 10l5 5 5-5" /><path d="M5 21h14" />
          </svg>
          Export PDF
        </button>
        <button class="btn btn-ghost" id="resetBtn">Reset</button>
      </div>
      <div class="print-legend" id="printLegend"></div>
    </header>

    <div class="name-card">
      <label for="nameInput">Name</label>
      <input class="name-input" id="nameInput" type="text" placeholder="Enter your name" autocomplete="name" />
    </div>

    <div class="progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount">0 / 0</div>
    </div>

    <div class="framework" id="framework"></div>
  </main>

  <script>
    const categories = [
      {
        name: 'Growth Mindset',
        competencies: [
          'Curious', 'Open to Feedback', 'Experimentation',
          'Focusing on Solutions', 'Make work Better'
        ]
      },
      {
        name: 'Trusted',
        competencies: [
          'Open and Transparent', 'Listen and Gives Candid Feedback',
          'Open / Not Shying away from Tough Conversations',
          'Creating Safe Environments to Debate'
        ]
      },
      {
        name: 'Team Focused',
        competencies: ['Respectful', 'Empathy', 'Open to different Perspectives']
      },
      {
        name: 'Courageous',
        competencies: [
          'Willingness to make critical decisions', 'Ownership',
          'Taking calculated risks', 'Combining Data and Experience',
          'Forging actionable Path forward', 'Sharing Unusual Ideas'
        ]
      },
      {
        name: 'Resourceful',
        competencies: [
          'Facing Challenges Head on', 'Creative', 'Resilient',
          'Ability to Prioritise', 'Simplification', 'Move things Forward'
        ]
      },
      {
        name: 'Outcome Focused',
        competencies: [
          'Customer Centric View',
          'Internal Perspective View Balanced with External View',
          'Ability to Adjust a course of Action with Agility',
          'Being Open to Fail Fast', 'Focused on Client Success'
        ]
      }
    ];

    // Empty, half and full circles, matching the Not yet / Getting there / Strong scale
    const levels = [
      { key: 'low',    label: 'Low',
        icon: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>' },
      { key: 'medium', label: 'Medium',
        icon: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 2a8 8 0 0 1 0 16z" fill="currentColor"/></svg>' },
      { key: 'high',   label: 'High',
        icon: '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5" fill="currentColor"/></svg>' }
    ];

    document.getElementById('printLegend').innerHTML =
      levels.map(l => `<span>${l.icon}${l.label}</span>`).join('');

    const framework = document.getElementById('framework');
    const progressFill = document.getElementById('progressFill');
    const progressCount = document.getElementById('progressCount');
    const total = categories.reduce((n, cat) => n + cat.competencies.length, 0);

    function updateProgress() {
      const rated = document.querySelectorAll('.rating-btn.active').length;
      progressFill.style.width = `${(rated / total) * 100}%`;
      progressCount.textContent = `${rated} / ${total}`;
    }

    categories.forEach((cat, i) => {
      const section = document.createElement('section');
      section.className = 'category';

      const eyebrow = document.createElement('div');
      eyebrow.className = 'category-eyebrow';
      eyebrow.textContent = `Category ${i + 1}`;

      const heading = document.createElement('h2');
      heading.textContent = cat.name;

      const list = document.createElement('div');
      list.className = 'competencies';

      cat.competencies.forEach(comp => {
        const row = document.createElement('div');
        row.className = 'competency';

        const label = document.createElement('span');
        label.className = 'competency-label';
        label.textContent = comp;

        const buttons = document.createElement('div');
        buttons.className = 'rating-buttons';
        buttons.setAttribute('role', 'group');
        buttons.setAttribute('aria-label', comp);

        levels.forEach(level => {
          const btn = document.createElement('button');
          btn.className = `rating-btn ${level.key}`;
          btn.type = 'button';
          btn.setAttribute('aria-pressed', 'false');
          btn.innerHTML = `${level.icon}<span>${level.label}</span>`;
          btn.addEventListener('click', () => {
            const isActive = btn.classList.contains('active');
            buttons.querySelectorAll('.rating-btn').forEach(b => {
              b.classList.remove('active');
              b.setAttribute('aria-pressed', 'false');
            });
            if (!isActive) {
              btn.classList.add('active');
              btn.setAttribute('aria-pressed', 'true');
            }
            updateProgress();
          });
          buttons.appendChild(btn);
        });

        row.appendChild(label);
        row.appendChild(buttons);
        list.appendChild(row);
      });

      section.appendChild(eyebrow);
      section.appendChild(heading);
      section.appendChild(list);
      framework.appendChild(section);
    });

    updateProgress();

    // Reset
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.querySelectorAll('.rating-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      document.getElementById('nameInput').value = '';
      updateProgress();
    });

    // Export PDF
    document.getElementById('exportBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      const originalTitle = document.title;
      document.getElementById('pageTitle').setAttribute('data-name', name);
      if (name) document.title = `${name} — People Development Framework`;
      window.print();
      document.title = originalTitle;
    });
  </script>

</body>
</html>
