<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People Development Framework</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234ade80' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:           #11121b;
      --topbar:       #0b0c13;
      --header:       #181a27;
      --card:         #1a1d2c;
      --input:        #0f1018;
      --accent:       #8b7cf6;
      --accent-hover: #7a6aef;
      --text:         #f1f2f7;
      --text-body:    #d7d9e4;
      --text-muted:   #8a8fa8;
      --border:       #272a3c;
      --border-hover: #383c55;
      --stage-bg:     #13281d;
      --stage-text:   #4ade80;
      --high-color:   #22c55e;
      --med-color:    #f59e0b;
      --low-color:    #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--topbar);
      padding: 16px 40px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .home-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      transition: color 0.15s;
    }

    .home-link:hover { color: var(--text); }
    .home-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .crumb-sep { color: #4a4e66; font-weight: 400; }

    .leaf {
      width: 20px;
      height: 20px;
      color: var(--stage-text);
      flex-shrink: 0;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name-input {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }

    .name-input::placeholder { color: var(--text-muted); }
    .name-input:focus { border-color: var(--accent); }

    .btn-export {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-export:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-reset:hover { border-color: var(--border-hover); color: var(--text); }

    /* ── Header ── */
    .header {
      background: linear-gradient(180deg, var(--header) 0%, #141623 100%);
      padding: 16px 40px 18px;
      border-bottom: 1px solid var(--border);
    }

    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .header .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: #262938;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .progress-label {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* ── Areas grid ── */
    .page-content {
      padding: 18px 40px 24px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 12px;
      transition: border-color 0.2s;
    }

    .panel.complete { border-color: rgba(74,222,128,0.35); }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage-badge {
      display: inline-block;
      background: var(--stage-bg);
      color: var(--stage-text);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .panel h2 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text);
      flex: 1;
    }

    .panel-count {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 12px;
    }

    /* ── Competency rows ── */
    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 5px 6px 5px 12px;
      transition: border-color 0.2s;
    }

    .card:hover { border-color: var(--border-hover); }

    .card-label {
      flex: 1;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-body);
      line-height: 1.35;
    }

    .rating-buttons {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .rating-btn {
      width: 28px;
      height: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .rating-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    .rating-btn.active.high   { background: var(--high-color); border-color: var(--high-color); color: #fff; }
    .rating-btn.active.medium { background: var(--med-color);  border-color: var(--med-color);  color: #fff; }
    .rating-btn.active.low    { background: var(--low-color);  border-color: var(--low-color);  color: #fff; }

    .card.rated-high   { border-color: rgba(34,197,94,0.45); }
    .card.rated-medium { border-color: rgba(245,158,11,0.45); }
    .card.rated-low    { border-color: rgba(239,68,68,0.45); }

    .legend {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .legend b { color: var(--text-body); font-weight: 600; }

    /* ── Narrower screens ── */
    @media (max-width: 1180px) {
      .page-content { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .topbar { flex-wrap: wrap; padding: 14px 16px; }
      .topbar-controls { width: 100%; }
      .home-text { display: none; }
      .name-input { flex: 1; width: auto; min-width: 0; }
      .topbar-controls .btn-export,
      .topbar-controls .btn-reset { padding: 9px 12px; white-space: nowrap; }
      .header { padding: 20px 16px; }
      .header h1 { font-size: 22px; }
      .header-row { flex-direction: column; align-items: flex-start; gap: 8px; }
      .page-content { grid-template-columns: 1fr; padding: 16px 16px 40px; }
      .rating-btn { width: 36px; height: 36px; }
    }

    /* ── Print / Export PDF ── */
    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      body {
        background: var(--bg) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .topbar, .progress, .legend { display: none !important; }

      .header { padding: 0 0 8px; background: none; border: none; }
      .header h1 { font-size: 15px; }
      .header .subtitle { font-size: 9px; margin-top: 2px; }

      .page-content {
        padding: 0;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .panel { padding: 6px 8px; border-radius: 6px; break-inside: avoid; }
      .stage-badge { font-size: 7px; padding: 2px 5px; letter-spacing: 1px; }
      .panel h2 { font-size: 11px; }
      .panel-count { display: none; }

      .cards { gap: 3px; margin-top: 5px; }
      .card { padding: 3px 4px 3px 6px; gap: 6px; border-radius: 4px; }
      .card-label { font-size: 8px; line-height: 1.3; }
      .rating-buttons { gap: 2px; }
      .rating-btn { width: 14px; height: 13px; font-size: 7px; border-radius: 3px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">
      <a class="home-link" href="https://simon-development-toolkit.netlify.app/" title="Back to Development Toolkit home">
        <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        <span class="home-text">Development Toolkit</span>
      </a>
      <span class="crumb-sep">/</span>
      <span>People Development Framework</span>
    </div>
    <div class="topbar-controls">
      <input class="name-input" id="nameInput" type="text" placeholder="Enter your name" />
      <button class="btn-export" id="exportBtn">Export PDF</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="header">
    <div class="header-row">
      <div>
        <h1 id="headerTitle">People Development Framework</h1>
        <p class="subtitle" id="headerSubtitle"></p>
      </div>
      <div class="legend"><span><b>L</b> Low</span><span><b>M</b> Medium</span><span><b>H</b> High</span></div>
    </div>
    <div class="progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel"></span>
    </div>
  </div>

  <div class="page-content" id="framework"></div>

  <script>
    const categories = [
      {
        name: 'Growth Mindset',
        description: 'Do I stay curious, seek feedback, and keep looking for ways to improve?',
        competencies: [
          'Curious', 'Open to Feedback', 'Experimentation',
          'Focusing on Solutions', 'Make work Better'
        ]
      },
      {
        name: 'Trusted',
        description: 'Do people trust me to be open, honest, and fair — even when it is difficult?',
        competencies: [
          'Open and Transparent', 'Listen and Gives Candid Feedback',
          'Open / Not Shying away from Tough Conversations',
          'Creating Safe Environments to Debate'
        ]
      },
      {
        name: 'Team Focused',
        description: 'Do I treat others with respect and make space for different views?',
        competencies: ['Respectful', 'Empathy', 'Open to different Perspectives']
      },
      {
        name: 'Courageous',
        description: 'Do I make the tough calls, own the outcome, and speak up with new ideas?',
        competencies: [
          'Willingness to make critical decisions', 'Ownership',
          'Taking calculated risks', 'Combining Data and Experience',
          'Forging actionable Path forward', 'Sharing Unusual Ideas'
        ]
      },
      {
        name: 'Resourceful',
        description: 'Do I find a way through challenges, prioritise well, and keep things moving?',
        competencies: [
          'Facing Challenges Head on', 'Creative', 'Resilient',
          'Ability to Prioritise', 'Simplification', 'Move things Forward'
        ]
      },
      {
        name: 'Outcome Focused',
        description: 'Do I keep the customer at the centre and adapt quickly to deliver results?',
        competencies: [
          'Customer Centric View',
          'Internal Perspective View Balanced with External View',
          'Ability to Adjust a course of Action with Agility',
          'Being Open to Fail Fast', 'Focused on Client Success'
        ]
      }
    ];

    const totalCompetencies = categories.reduce((n, c) => n + c.competencies.length, 0);
    const framework = document.getElementById('framework');
    const panels = [];
    const levels = [
      { key: 'low',    short: 'L', name: 'Low' },
      { key: 'medium', short: 'M', name: 'Medium' },
      { key: 'high',   short: 'H', name: 'High' }
    ];

    document.getElementById('headerSubtitle').textContent =
      `Rate each competency — Low, Medium, or High · ${categories.length} areas · ${totalCompetencies} competencies`;

    function updateProgress() {
      const rated = document.querySelectorAll('.rating-btn.active').length;
      document.getElementById('progressFill').style.width = `${(rated / totalCompetencies) * 100}%`;
      document.getElementById('progressLabel').textContent = `${rated} / ${totalCompetencies} rated`;
      panels.forEach((panel, i) => {
        const count = panel.querySelectorAll('.rating-btn.active').length;
        const total = categories[i].competencies.length;
        panel.querySelector('.panel-count').textContent = `${count}/${total}`;
        panel.classList.toggle('complete', count === total);
      });
    }

    categories.forEach((cat, catIndex) => {
      const panel = document.createElement('section');
      panel.className = 'panel';
      panel.innerHTML = `
        <div class="panel-head">
          <span class="stage-badge">Area ${catIndex + 1}</span>
          <h2></h2>
          <span class="panel-count"></span>
        </div>
        <div class="cards"></div>
      `;
      panel.querySelector('h2').textContent = cat.name;
      panel.querySelector('h2').title = cat.description;

      const cardsEl = panel.querySelector('.cards');

      cat.competencies.forEach(comp => {
        const card = document.createElement('div');
        card.className = 'card';

        const label = document.createElement('span');
        label.className = 'card-label';
        label.textContent = comp;

        const buttons = document.createElement('div');
        buttons.className = 'rating-buttons';

        levels.forEach(level => {
          const btn = document.createElement('button');
          btn.className = `rating-btn ${level.key}`;
          btn.textContent = level.short;
          btn.title = level.name;
          btn.setAttribute('aria-label', `${comp}: ${level.name}`);
          btn.addEventListener('click', () => {
            const isActive = btn.classList.contains('active');
            buttons.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            ['rated-high', 'rated-medium', 'rated-low'].forEach(c => card.classList.remove(c));
            if (!isActive) {
              btn.classList.add('active');
              card.classList.add(`rated-${level.key}`);
            }
            updateProgress();
          });
          buttons.appendChild(btn);
        });

        card.appendChild(label);
        card.appendChild(buttons);
        cardsEl.appendChild(card);
      });

      framework.appendChild(panel);
      panels.push(panel);
    });

    updateProgress();

    // Reset
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.card').forEach(c => {
        c.classList.remove('rated-high', 'rated-medium', 'rated-low');
      });
      document.getElementById('nameInput').value = '';
      updateProgress();
    });

    // Export PDF
    document.getElementById('exportBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      const heading = document.getElementById('headerTitle');
      const originalTitle = document.title;
      const originalHeading = heading.textContent;
      if (name) {
        document.title = `${name} — People Development Framework`;
        heading.textContent = document.title;
      }
      window.print();
      document.title = originalTitle;
      heading.textContent = originalHeading;
    });
  </script>

</body>
</html>
