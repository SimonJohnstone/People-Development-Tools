<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People Development Framework</title>
  <style>
    :root {
      --bg:           #1a1520;
      --surface:      #231d2e;
      --card:         #2a2438;
      --accent:       #e05550;
      --text:         #e8e0f0;
      --text-muted:   #8880a0;
      --border:       #3a3248;
      --high-color:   #4caf70;
      --med-color:    #e6a020;
      --low-color:    #e05550;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0;
      min-height: 100vh;
    }

    /* Top nav bar */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #120f1a;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      flex: 1;
    }

    .topbar-title h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .topbar-title p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }

    .name-input::placeholder { color: var(--text-muted); font-style: italic; }
    .name-input:focus { border-color: var(--accent); }

    .btn-export {
      background: #5a1a18;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-export:hover { background: #7a2420; }

    .btn-reset {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .btn-reset:hover { background: var(--card); color: var(--text); }

    .page-content {
      padding: 28px 24px;
    }

    .framework {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Category section */
    .category {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
    }

    .category-header h2 {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text);
      flex: 1;
    }

    .category-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Cards */
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 10px 10px;
      flex: 1 1 130px;
      min-width: 120px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
      cursor: default;
    }

    .card:hover {
      border-color: #5a5068;
    }

    .card-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      flex: 1;
      line-height: 1.45;
    }

    /* Rated state tints */
    .card.rated-high   { background: rgba(76,175,112,0.35); border-color: var(--high-color); }
    .card.rated-medium { background: rgba(230,160,32,0.35); border-color: var(--med-color); }
    .card.rated-low    { background: rgba(224,85,80,0.35);  border-color: var(--low-color); }

    /* Rating buttons */
    .rating-buttons {
      display: flex;
      gap: 4px;
    }

    .rating-btn {
      flex: 1;
      border: 1px solid currentColor;
      background: transparent;
      border-radius: 4px;
      padding: 3px 0;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .rating-btn.high,
    .rating-btn.medium,
    .rating-btn.low    { color: #fff; border-color: rgba(255,255,255,0.3); }

    .rating-btn.active.high   { background: var(--high-color); color: #fff; border-color: var(--high-color); }
    .rating-btn.active.medium { background: var(--med-color);  color: #fff; border-color: var(--med-color); }
    .rating-btn.active.low    { background: var(--low-color);  color: #fff; border-color: var(--low-color); }

    .rating-btn:hover:not(.active) { opacity: 0.65; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">
      <h1>People Development Framework</h1>
      <p>Rate each competency — High, Medium, or Low</p>
    </div>
    <div class="topbar-controls">
      <input class="name-input" id="nameInput" type="text" placeholder="Enter your name" />
      <button class="btn-export" id="exportBtn">Export PDF</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="page-content">
    <div class="framework" id="framework"></div>
  </div>

  <script>
    const categories = [
      {
        name: 'Growth Mindset',
        competencies: [
          'Curious', 'Open to Feedback', 'Experimentation',
          'Focusing on Solutions', 'Make work Better'
        ]
      },
      {
        name: 'Trusted',
        competencies: [
          'Open and Transparent', 'Listen and Gives Candid Feedback',
          'Open / Not Shying away from Tough Conversations',
          'Creating Safe Environments to Debate'
        ]
      },
      {
        name: 'Team Focused',
        competencies: ['Respectful', 'Empathy', 'Open to different Perspectives']
      },
      {
        name: 'Courageous',
        competencies: [
          'Willingness to make critical decisions', 'Ownership',
          'Taking calculated risks', 'Combining Data and Experience',
          'Forging actionable Path forward', 'Sharing Unusual Ideas'
        ]
      },
      {
        name: 'Resourceful',
        competencies: [
          'Facing Challenges Head on', 'Creative', 'Resilient',
          'Ability to Prioritise', 'Simplification', 'Move things Forward'
        ]
      },
      {
        name: 'Outcome Focused',
        competencies: [
          'Customer Centric View',
          'Internal Perspective View Balanced with External View',
          'Ability to Adjust a course of Action with Agility',
          'Being Open to Fail Fast', 'Focused on Client Success'
        ]
      }
    ];

    const framework = document.getElementById('framework');

    categories.forEach(cat => {
      const section = document.createElement('div');
      section.className = 'category';

      section.innerHTML = `
        <div class="category-header">
          <h2>${cat.name}</h2>
        </div>
        <div class="cards"></div>
      `;

      const cardsEl = section.querySelector('.cards');

      cat.competencies.forEach(comp => {
        const card = document.createElement('div');
        card.className = 'card';

        const label = document.createElement('span');
        label.className = 'card-label';
        label.textContent = comp;

        const buttons = document.createElement('div');
        buttons.className = 'rating-buttons';

        ['high', 'medium', 'low'].forEach(level => {
          const btn = document.createElement('button');
          btn.className = `rating-btn ${level}`;
          btn.textContent = level.charAt(0).toUpperCase() + level.slice(1);
          btn.addEventListener('click', () => {
            const isActive = btn.classList.contains('active');
            buttons.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            ['rated-high', 'rated-medium', 'rated-low'].forEach(c => card.classList.remove(c));
            if (!isActive) {
              btn.classList.add('active');
              card.classList.add(`rated-${level}`);
            }
          });
          buttons.appendChild(btn);
        });

        card.appendChild(label);
        card.appendChild(buttons);
        cardsEl.appendChild(card);
      });

      framework.appendChild(section);
    });
    // Reset
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.card').forEach(c => {
        c.classList.remove('rated-high', 'rated-medium', 'rated-low');
      });
      document.getElementById('nameInput').value = '';
    });

    // Export PDF
    document.getElementById('exportBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      const originalTitle = document.title;
      if (name) document.title = `${name} — People Development Framework`;
      window.print();
      document.title = originalTitle;
    });
  </script>

</body>
</html>
