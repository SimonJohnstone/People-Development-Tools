<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People Development Framework</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:           #11121b;
      --topbar:       #0b0c13;
      --header:       #181a27;
      --card:         #1a1d2c;
      --input:        #0f1018;
      --accent:       #8b7cf6;
      --accent-hover: #7a6aef;
      --text:         #f1f2f7;
      --text-body:    #d7d9e4;
      --text-muted:   #8a8fa8;
      --border:       #272a3c;
      --border-hover: #383c55;
      --stage-bg:     #13281d;
      --stage-text:   #4ade80;
      --high-color:   #22c55e;
      --med-color:    #f59e0b;
      --low-color:    #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--topbar);
      padding: 16px 40px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name-input {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }

    .name-input::placeholder { color: var(--text-muted); }
    .name-input:focus { border-color: var(--accent); }

    .btn-export {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-export:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-reset:hover { border-color: var(--border-hover); color: var(--text); }

    /* ── Header ── */
    .header {
      background: linear-gradient(180deg, var(--header) 0%, #141623 100%);
      padding: 40px 40px 44px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .header .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .progress {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: #262938;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .progress-label {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 0 40px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 18px 22px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab:hover { color: var(--text-body); }

    .tab .tab-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4a4e66;
      transition: background 0.15s;
    }

    .tab.complete .tab-dot { background: var(--stage-text); }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab.active .tab-dot { background: var(--accent); }

    /* ── Section ── */
    .page-content {
      padding: 44px 40px 64px;
      max-width: 1320px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .stage-badge {
      display: inline-block;
      background: var(--stage-bg);
      color: var(--stage-text);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 7px 12px;
      border-radius: 6px;
    }

    .panel h2 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
      margin-top: 22px;
    }

    .panel .panel-desc {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 30px;
    }

    /* ── Competency cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      transition: border-color 0.2s, background 0.2s;
    }

    .card:hover { border-color: var(--border-hover); }

    .card-label {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-body);
      line-height: 1.5;
    }

    .rating-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }

    .scale-label {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      width: 90px;
    }

    .scale-label.end { text-align: right; }

    .rating-buttons {
      display: flex;
      gap: 10px;
    }

    .rating-btn {
      min-width: 88px;
      height: 44px;
      padding: 0 16px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .rating-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    .rating-btn.active.high   { background: var(--high-color); border-color: var(--high-color); color: #fff; }
    .rating-btn.active.medium { background: var(--med-color);  border-color: var(--med-color);  color: #fff; }
    .rating-btn.active.low    { background: var(--low-color);  border-color: var(--low-color);  color: #fff; }

    .card.rated-high   { border-color: rgba(34,197,94,0.45); }
    .card.rated-medium { border-color: rgba(245,158,11,0.45); }
    .card.rated-low    { border-color: rgba(239,68,68,0.45); }

    .panel-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }

    .panel-nav .btn-reset[hidden],
    .panel-nav .btn-export[hidden] { visibility: hidden; display: inline-block; }

    /* ── Small screens ── */
    @media (max-width: 720px) {
      .topbar { flex-wrap: wrap; padding: 14px 16px; }
      .topbar-controls { width: 100%; }
      .name-input { flex: 1; width: auto; min-width: 0; }
      .topbar-controls .btn-export,
      .topbar-controls .btn-reset { padding: 9px 12px; white-space: nowrap; }
      .header { padding: 28px 16px 32px; }
      .header h1 { font-size: 24px; }
      .tabs { padding: 0 8px; }
      .tab { padding: 16px 14px 14px; }
      .page-content { padding: 32px 16px 48px; }
      .card { padding: 20px; }
      .scale-label { display: none; }
      .rating-row { justify-content: flex-start; }
      .rating-buttons { width: 100%; }
      .rating-btn { flex: 1; min-width: 0; padding: 0; }
    }

    /* ── Print / Export PDF ── */
    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      body {
        background: var(--bg) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .topbar, .tabs, .progress, .panel-nav { display: none !important; }

      .header { padding: 0 0 8px; background: none; border: none; }
      .header h1 { font-size: 15px; }
      .header .subtitle { font-size: 9px; margin-top: 2px; }

      .page-content {
        padding: 0;
        max-width: none;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .panel {
        display: block !important;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 8px;
        break-inside: avoid;
      }

      .stage-badge { font-size: 7px; padding: 2px 5px; letter-spacing: 1px; }
      .panel h2 { font-size: 11px; margin-top: 3px; }
      .panel .panel-desc { display: none; }

      .cards { gap: 3px; margin-top: 5px; }

      .card {
        padding: 3px 6px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--input);
      }

      .card-label { font-size: 8px; flex: 1; line-height: 1.3; }
      .rating-row { margin-top: 0; }
      .scale-label { display: none; }
      .rating-buttons { gap: 2px; }
      .rating-btn { min-width: 0; height: auto; padding: 1px 4px; font-size: 7px; border-radius: 3px; }

    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">
      <span class="dot"></span>
      <span>People Development Framework</span>
    </div>
    <div class="topbar-controls">
      <input class="name-input" id="nameInput" type="text" placeholder="Enter your name" />
      <button class="btn-export" id="exportBtn">Export PDF</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="header">
    <h1 id="headerTitle">People Development Framework</h1>
    <p class="subtitle" id="headerSubtitle"></p>
    <div class="progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel"></span>
    </div>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <div class="page-content" id="framework"></div>

  <script>
    const categories = [
      {
        name: 'Growth Mindset',
        description: 'Do I stay curious, seek feedback, and keep looking for ways to improve?',
        competencies: [
          'Curious', 'Open to Feedback', 'Experimentation',
          'Focusing on Solutions', 'Make work Better'
        ]
      },
      {
        name: 'Trusted',
        description: 'Do people trust me to be open, honest, and fair — even when it is difficult?',
        competencies: [
          'Open and Transparent', 'Listen and Gives Candid Feedback',
          'Open / Not Shying away from Tough Conversations',
          'Creating Safe Environments to Debate'
        ]
      },
      {
        name: 'Team Focused',
        description: 'Do I treat others with respect and make space for different views?',
        competencies: ['Respectful', 'Empathy', 'Open to different Perspectives']
      },
      {
        name: 'Courageous',
        description: 'Do I make the tough calls, own the outcome, and speak up with new ideas?',
        competencies: [
          'Willingness to make critical decisions', 'Ownership',
          'Taking calculated risks', 'Combining Data and Experience',
          'Forging actionable Path forward', 'Sharing Unusual Ideas'
        ]
      },
      {
        name: 'Resourceful',
        description: 'Do I find a way through challenges, prioritise well, and keep things moving?',
        competencies: [
          'Facing Challenges Head on', 'Creative', 'Resilient',
          'Ability to Prioritise', 'Simplification', 'Move things Forward'
        ]
      },
      {
        name: 'Outcome Focused',
        description: 'Do I keep the customer at the centre and adapt quickly to deliver results?',
        competencies: [
          'Customer Centric View',
          'Internal Perspective View Balanced with External View',
          'Ability to Adjust a course of Action with Agility',
          'Being Open to Fail Fast', 'Focused on Client Success'
        ]
      }
    ];

    const totalCompetencies = categories.reduce((n, c) => n + c.competencies.length, 0);
    const framework = document.getElementById('framework');
    const tabsEl = document.getElementById('tabs');
    const tabs = [];
    const panels = [];

    document.getElementById('headerSubtitle').textContent =
      `Rate each competency — Low, Medium, or High · ${categories.length} areas · ${totalCompetencies} competencies`;

    function showPanel(index) {
      tabs.forEach((t, i) => t.classList.toggle('active', i === index));
      panels.forEach((p, i) => p.classList.toggle('active', i === index));
    }

    function updateProgress() {
      const rated = document.querySelectorAll('.rating-btn.active').length;
      document.getElementById('progressFill').style.width = `${(rated / totalCompetencies) * 100}%`;
      document.getElementById('progressLabel').textContent = `${rated} / ${totalCompetencies} rated`;
      panels.forEach((panel, i) => {
        const complete = panel.querySelectorAll('.rating-btn.active').length === categories[i].competencies.length;
        tabs[i].classList.toggle('complete', complete);
      });
    }

    categories.forEach((cat, catIndex) => {
      // Tab
      const tab = document.createElement('button');
      tab.className = 'tab';
      tab.innerHTML = `<span class="tab-dot"></span><span></span>`;
      tab.lastChild.textContent = cat.name;
      tab.addEventListener('click', () => showPanel(catIndex));
      tabsEl.appendChild(tab);
      tabs.push(tab);

      // Panel
      const panel = document.createElement('section');
      panel.className = 'panel';
      panel.innerHTML = `
        <span class="stage-badge">Area ${catIndex + 1}</span>
        <h2></h2>
        <p class="panel-desc"></p>
        <div class="cards"></div>
        <div class="panel-nav">
          <button class="btn-reset prev-btn">← Previous</button>
          <button class="btn-export next-btn">Next →</button>
        </div>
      `;
      panel.querySelector('h2').textContent = cat.name;
      panel.querySelector('.panel-desc').textContent = cat.description;

      const prev = panel.querySelector('.prev-btn');
      const next = panel.querySelector('.next-btn');
      prev.hidden = catIndex === 0;
      next.hidden = catIndex === categories.length - 1;
      prev.addEventListener('click', () => { showPanel(catIndex - 1); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      next.addEventListener('click', () => { showPanel(catIndex + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); });

      const cardsEl = panel.querySelector('.cards');

      cat.competencies.forEach(comp => {
        const card = document.createElement('div');
        card.className = 'card';

        const label = document.createElement('p');
        label.className = 'card-label';
        label.textContent = comp;

        const row = document.createElement('div');
        row.className = 'rating-row';
        row.innerHTML = `<span class="scale-label">Needs<br>Development</span>`;

        const buttons = document.createElement('div');
        buttons.className = 'rating-buttons';

        ['low', 'medium', 'high'].forEach(level => {
          const btn = document.createElement('button');
          btn.className = `rating-btn ${level}`;
          btn.textContent = level.charAt(0).toUpperCase() + level.slice(1);
          btn.addEventListener('click', () => {
            const isActive = btn.classList.contains('active');
            buttons.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            ['rated-high', 'rated-medium', 'rated-low'].forEach(c => card.classList.remove(c));
            if (!isActive) {
              btn.classList.add('active');
              card.classList.add(`rated-${level}`);
            }
            updateProgress();
          });
          buttons.appendChild(btn);
        });

        row.appendChild(buttons);
        row.insertAdjacentHTML('beforeend', `<span class="scale-label end">Real<br>Strength</span>`);

        card.appendChild(label);
        card.appendChild(row);
        cardsEl.appendChild(card);
      });

      framework.appendChild(panel);
      panels.push(panel);
    });

    showPanel(0);
    updateProgress();

    // Reset
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.card').forEach(c => {
        c.classList.remove('rated-high', 'rated-medium', 'rated-low');
      });
      document.getElementById('nameInput').value = '';
      updateProgress();
      showPanel(0);
    });

    // Export PDF
    document.getElementById('exportBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      const heading = document.getElementById('headerTitle');
      const originalTitle = document.title;
      const originalHeading = heading.textContent;
      if (name) {
        document.title = `${name} — People Development Framework`;
        heading.textContent = document.title;
      }
      window.print();
      document.title = originalTitle;
      heading.textContent = originalHeading;
    });
  </script>

</body>
</html>
