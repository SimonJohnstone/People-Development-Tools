<!DOCTYPE html>
<!--
  Team edition of the Psychological Safety Survey, published as a claude.ai
  artifact: https://claude.ai/artifact/2By3qsfyKBj8yYGtpX7Kxs
  Declared capabilities: {"db": {}, "user": {}}. Responses are stored
  anonymously in the artifact database ("responses" collection). Opened
  outside claude.ai it falls back to saving responses in the browser.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Psychological Safety Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg:        #f6f3ee;
    --card:      #ffffff;
    --soft:      #faf8f5;
    --ink:       #1c1a18;
    --ink-hover: #3a3632;
    --text:      #2b2825;
    --muted:     #6f6a64;
    --faint:     #a8a29b;
    --border:    #e6e1da;
    --border-btn:#e2ddd6;
    --track:     #ebe7e1;
    --danger:    #b3392f;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:  'DM Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  .test-note { max-width: 760px; margin: 0 auto; padding: 16px 16px 0; text-align: center; font-size: 13px; color: var(--muted); }
  .test-note strong { color: var(--ink); }

  /* ── NAV ── */
  .top-nav { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 16px 0; }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tab { padding: 12px 22px; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--muted); transition: all 0.15s; }
  .nav-tab:hover { color: var(--ink); }
  .nav-tab.active { background: var(--card); border-color: var(--border); color: var(--ink); box-shadow: 0 1px 2px rgba(28,26,24,0.06); }
  .resp-count { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); }

  /* ── LAYOUT ── */
  .content, .results-wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
  .dash-wrap { max-width: 920px; margin: 0 auto; padding: 32px 16px 80px; }

  /* ── HEADER ── */
  .header { max-width: 760px; margin: 0 auto; padding: 40px 16px 0; text-align: center; }
  .header h1 { font-family: var(--serif); font-size: clamp(28px, 5vw, 40px); font-weight: 700; color: var(--ink); letter-spacing: -0.5px; line-height: 1.15; }
  .header p { font-size: 16px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .header-row { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .progress-bar-wrap { margin-top: 30px; }
  .progress-bar-track { height: 5px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--ink); border-radius: 99px; transition: width 0.4s ease; }
  .progress-label { display: block; text-align: right; font-size: 14px; font-weight: 600; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }

  /* ── STAGE STEPPER ── */
  .stage-tabs { max-width: 760px; margin: 18px auto 28px; padding: 0 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stage-tab { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); padding-top: 10px; border-top: 3px solid var(--track); display: flex; align-items: center; gap: 6px; }
  .stage-tab.active { color: var(--ink); border-top-color: var(--ink); }
  .stage-tab.completed { color: var(--muted); border-top-color: var(--muted); }
  .stage-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; flex-shrink: 0; }
  .stage-tab.active .stage-dot, .stage-tab.completed .stage-dot { background: currentColor; }

  /* ── SURVEY ── */
  .stage-intro { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px 36px; margin-bottom: 16px; }
  .stage-badge { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .stage-swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .stage-title { font-family: var(--serif); font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  .stage-description { font-size: 16.5px; color: var(--muted); margin-top: 8px; line-height: 1.55; }
  .questions-list { display: flex; flex-direction: column; gap: 16px; }
  .question-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px 36px; transition: border-color 0.2s; }
  .question-num { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .question-text { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--ink); line-height: 1.35; margin-bottom: 22px; }
  .scale-options { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .scale-btn { height: 64px; border-radius: 12px; border: 2px solid var(--border-btn); background: var(--card); color: var(--muted); font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .scale-btn:hover { border-color: #c9c3bb; color: var(--ink); }
  .scale-btn.selected { background: var(--ink); border-color: var(--ink); color: #fff; }
  .scale-row { display: flex; justify-content: space-between; margin-top: 10px; }
  .scale-label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); }
  .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 12px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; border: 1.5px solid transparent; transition: all 0.15s; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border-btn); }
  .btn-ghost:hover { background: var(--card); color: var(--ink); }
  .btn-sm { padding: 9px 16px; font-size: 13px; border-radius: 10px; }
  .btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn-primary:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-danger { background: transparent; color: var(--danger); border-color: #ead3cf; }
  .btn-danger:hover { background: #fbf1ef; }
  .btn:focus-visible, .scale-btn:focus-visible, .nav-tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .questions-remaining { font-size: 14px; font-weight: 600; color: var(--muted); }

  /* ── PERSONAL RESULTS ── */
  .stage-result-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 26px 30px; margin-bottom: 14px; }
  .stage-result-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .stage-result-name { display: flex; flex-direction: column; gap: 6px; }
  .stage-result-name span { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--ink); }
  .stage-result-name .stage-num-badge { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .score-display { font-family: var(--serif); font-size: 28px; font-weight: 700; white-space: nowrap; }
  .score-bar-track { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .score-bar-fill { height: 100%; border-radius: 99px; }
  .score-interpretation { font-size: 15px; color: var(--muted); line-height: 1.55; }
  .overall-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; margin-bottom: 14px; display: flex; align-items: center; gap: 24px; }
  .overall-score-circle { width: 96px; height: 96px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
  .overall-score-number { font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1; }
  .overall-score-max { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .overall-text h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .overall-text p { font-size: 15px; color: var(--muted); line-height: 1.55; }
  .insight-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 26px 30px; margin-top: 14px; }
  .insight-card h4 { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 14px; letter-spacing: 2px; text-transform: uppercase; }
  .insight-card ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .insight-card li { font-size: 15px; color: var(--text); line-height: 1.55; padding-left: 20px; position: relative; }
  .insight-card li::before { content: '→'; position: absolute; left: 0; color: var(--faint); }
  .submit-banner { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 26px 30px; margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .submit-banner p { font-size: 15px; color: var(--muted); line-height: 1.55; flex: 1 1 300px; }
  .submit-banner strong { color: var(--ink); }
  .submit-error { flex-basis: 100%; font-size: 14px; color: var(--danger); }

  /* ── DASHBOARD ── */
  .dash-section-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; margin-top: 32px; }
  .dash-section-title:first-child { margin-top: 0; }
  .dash-section-title .note { color: var(--faint); font-weight: 500; text-transform: none; letter-spacing: 0; }

  /* Summary tiles */
  .summary-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 8px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .tile-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 10px; }
  .tile-value { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1; }
  .tile-value.small { font-size: 18px; line-height: 1.25; }
  .tile-sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* Heatmap */
  .heatmap-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .hm-row { display: grid; grid-template-columns: 1fr 110px 60px; gap: 12px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--border); }
  .hm-row:last-child { border-bottom: none; }
  .hm-row.hm-head { background: var(--soft); }
  .hm-head div { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .hm-q-text { font-size: 14px; color: var(--text); line-height: 1.45; }
  .hm-stage-tag { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .hm-bar-track { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .hm-avg { font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

  /* Distribution bars */
  .dist-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 26px 30px; }
  .dist-stage { margin-bottom: 26px; }
  .dist-stage:last-child { margin-bottom: 0; }
  .dist-stage-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .dist-stage-name { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .dist-avg-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
  .dist-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .dist-bar-label { font-size: 12px; font-weight: 700; color: var(--muted); width: 14px; text-align: center; flex-shrink: 0; }
  .dist-bar-track { flex: 1; height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .dist-bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
  .dist-bar-count { font-size: 12px; color: var(--muted); width: 24px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }

  /* Responses table */
  .resp-table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow-x: auto; }
  .resp-table { width: 100%; border-collapse: collapse; }
  .resp-table th { padding: 14px 20px; font-size: 11px; font-weight: 700; color: var(--muted); text-align: left; background: var(--soft); border-bottom: 1px solid var(--border); letter-spacing: 1.5px; text-transform: uppercase; }
  .resp-table td { padding: 13px 20px; font-size: 14px; color: var(--text); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .resp-table tr:last-child td { border-bottom: none; }
  .score-pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; }

  /* Empty state */
  .empty-state { max-width: 760px; margin: 32px auto; background: var(--card); border: 1px solid var(--border); border-radius: 20px; text-align: center; padding: 56px 32px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
  .empty-state p { font-size: 15px; color: var(--muted); line-height: 1.6; max-width: 380px; margin: 0 auto; }

  /* Loading */
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 10px; color: var(--muted); font-size: 14px; }
  .spin { width: 18px; height: 18px; border: 2px solid var(--track); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Open question */
  .open-question-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px 36px; }
  .open-question-label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .open-question-text { font-family: var(--serif); font-size: 21px; font-weight: 600; color: var(--ink); line-height: 1.35; margin-bottom: 18px; }
  .open-textarea { width: 100%; background: var(--soft); border: 2px solid var(--border-btn); border-radius: 12px; color: var(--ink); font-family: inherit; font-size: 15px; line-height: 1.6; padding: 14px 16px; resize: vertical; min-height: 110px; outline: none; transition: border-color 0.2s; }
  .open-textarea:focus { border-color: var(--ink); background: var(--card); }
  .open-textarea::placeholder { color: var(--faint); }

  /* Comments section (dashboard) */
  .comments-stage { margin-bottom: 24px; }
  .comments-stage:last-child { margin-bottom: 0; }
  .comments-stage-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .comments-stage-name { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--ink); }
  .comment-count-badge { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--soft); border: 1px solid var(--border); padding: 3px 10px; border-radius: 99px; }
  .comment-item { background: var(--soft); border-left: 3px solid; border-radius: 0 10px 10px 0; padding: 12px 16px; margin-bottom: 8px; font-size: 15px; color: var(--text); line-height: 1.6; }
  .comment-item:last-child { margin-bottom: 0; }
  .no-comments { font-size: 14px; color: var(--faint); font-style: italic; }

  /* Delete confirm */
  .clear-row { display: flex; align-items: center; justify-content: flex-end; margin-top: 16px; }
  .clear-confirm { display: none; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

  /* ── SETUP SCREEN ── */
  .setup-wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  .setup-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 34px; }
  .setup-logo { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .setup-title { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .setup-sub { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
  .setup-steps { background: var(--soft); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 24px; }
  .setup-steps h4 { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; }
  .setup-step { display: flex; gap: 12px; margin-bottom: 10px; font-size: 14px; color: var(--text); line-height: 1.5; }
  .setup-step:last-child { margin-bottom: 0; }
  .setup-step strong { color: var(--ink); }
  .setup-step code { background: var(--card); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .setup-step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .setup-field { margin-bottom: 16px; }
  .setup-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
  .setup-input { width: 100%; background: var(--card); border: 2px solid var(--border-btn); border-radius: 10px; color: var(--ink); font-family: inherit; font-size: 15px; padding: 11px 13px; outline: none; transition: border-color 0.2s; }
  .setup-input:focus { border-color: var(--ink); }
  .setup-input::placeholder { color: var(--faint); }
  .setup-error { font-size: 13px; color: var(--danger); margin-top: 10px; display: none; }
  .setup-skip { font-size: 13px; color: var(--muted); text-align: center; margin-top: 14px; }
  .setup-skip a { color: inherit; text-decoration: underline; cursor: pointer; }

  @media (max-width: 640px) {
    .nav-tab { padding: 10px 14px; font-size: 15px; }
    .header { padding-top: 28px; }
    .header p { font-size: 15px; }
    .stage-tabs { grid-template-columns: repeat(2, 1fr); row-gap: 12px; }
    .stage-intro, .question-card, .open-question-card { padding: 24px 20px; border-radius: 16px; }
    .stage-title { font-size: 25px; }
    .question-text, .open-question-text { font-size: 18px; }
    .scale-options { gap: 6px; }
    .scale-btn { height: 52px; font-size: 16px; }
    .scale-label { font-size: 10.5px; letter-spacing: 0.8px; }
    .nav-row .btn { flex: 1; }
    .stage-result-card, .insight-card, .submit-banner, .dist-wrap { padding: 22px 20px; border-radius: 16px; }
    .overall-card { flex-direction: column; text-align: center; padding: 26px 20px; border-radius: 16px; }
    .summary-tiles { grid-template-columns: repeat(2, 1fr); }
    .hm-row { grid-template-columns: 1fr 52px; padding: 14px 18px; }
    .hm-row > :nth-child(2) { display: none; }
  }
</style>
</head>
<body>


<div class="top-nav">
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-survey" onclick="switchTab('survey')">Take Survey</button>
    <button class="nav-tab" id="tab-dashboard" onclick="switchTab('dashboard')">Team Dashboard</button>
  </div>
  <div class="resp-count" id="resp-count">0 responses</div>
</div>

<p class="test-note" id="storage-note" hidden></p>

<div id="view-survey"></div>
<div id="view-dashboard" style="display:none"></div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────
const STAGES = [
  { id:1, name:"Inclusion Safety", color:"#4f7d5c",
    description:"Do people feel genuinely accepted and able to be themselves in this team?",
    openQuestion:"What's one thing we could do to make people feel more genuinely included on this team?",
    questions:[
      "I feel like I truly belong on this team — not just tolerated, but genuinely included.",
      "I can be my authentic self at work without fear of being judged or excluded.",
      "Team members actively make space for different perspectives and backgrounds.",
      "I feel equally included regardless of my location, seniority, or background."
    ]},
  { id:2, name:"Learner Safety", color:"#4a6f96",
    description:"Do people feel safe to ask questions, make mistakes, and grow?",
    openQuestion:"What would make it easier to ask questions, admit mistakes, or try new things on this team?",
    questions:[
      "I feel comfortable asking questions even when I think I should already know the answer.",
      "It is safe to admit mistakes or say 'I don't know' on this team without negative consequences.",
      "I regularly receive honest, constructive feedback that helps me improve.",
      "Experimenting and trying new approaches is encouraged, even when it doesn't work out."
    ]},
  { id:3, name:"Contributor Safety", color:"#b08328",
    description:"Do people feel their contributions are valued and that they can make a real impact?",
    openQuestion:"What would help you feel that your ideas and contributions have more impact here?",
    questions:[
      "My ideas and input are genuinely considered — not just heard and set aside.",
      "I have the autonomy to bring my full expertise to my work.",
      "I feel like my contributions make a meaningful difference to the team's outcomes.",
      "I am trusted to take ownership and make decisions within my role."
    ]},
  { id:4, name:"Challenger Safety", color:"#b0473c",
    description:"Do people feel safe to speak up, disagree, and challenge the status quo?",
    openQuestion:"What would make it safer to speak up, raise concerns, or challenge the way things are done?",
    questions:[
      "I feel safe raising concerns or flagging problems — even to senior leadership.",
      "Disagreement is handled constructively on this team — different views are welcomed, not punished.",
      "I would speak up if I saw something that wasn't right, even if it might be unpopular.",
      "The team actively seeks out dissenting views before making important decisions."
    ]}
];

// ─── STATE ──────────────────────────────────────────────────────────────
let currentTab = 'survey';
let currentStage = 0;
let answers = {};
let comments = {}; // key: stageIdx, value: string (optional)
let surveySubmitted = false;
let allResponses = []; // loaded from storage
let confirmingClear = false;

// ─── STORAGE ────────────────────────────────────────────────────────────
// Responses are shared through this page's database: one anonymous
// document per submission in the `responses` collection. No viewer id
// or name is stored. When the database is not available (signed out,
// preview), responses fall back to this browser only.
const LS_RESPONSES = 'psych_safety_responses';
let db = null;
let isOwner = false;

function localRead() {
  try { const raw = localStorage.getItem(LS_RESPONSES); return raw ? JSON.parse(raw) : []; }
  catch(e) { return []; }
}
function localWrite(list) {
  try { localStorage.setItem(LS_RESPONSES, JSON.stringify(list)); } catch(e) {}
}
function showNote(html) {
  const el = document.getElementById('storage-note');
  el.innerHTML = html; el.hidden = !html;
}

async function loadResponses() {
  allResponses = localRead();
  updateRespCount();
  const c = window.claude;
  if (!c || !c.use) { showNote('<strong>Offline copy.</strong> Responses are saved in this browser only.'); return; }
  c.use('user').then(u => { isOwner = u ? !!u.isOwner() : false; if (currentTab==='dashboard') renderDashboard(); });
  db = await c.use('db');
  if (!db) { showNote('<strong>Sign in to claude.ai to share your response.</strong> Until then it is saved in this browser only.'); return; }
  db.collection('responses').orderBy('ts').onSnapshot(snap => {
    allResponses = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
    updateRespCount();
    if (currentTab === 'dashboard') renderDashboard();
  }, err => {
    console.error('Response feed stopped', err);
  });
}

async function saveResponse(resp) {
  if (!db) {
    const list = localRead(); list.push(resp); localWrite(list);
    allResponses = list; updateRespCount();
    return { ok: true, local: true };
  }
  try {
    await db.collection('responses').add(resp);
    return { ok: true };
  } catch(e) {
    if (e && e.code === 'unavailable') {
      await new Promise(r => setTimeout(r, 800 + Math.random()*800));
      try { await db.collection('responses').add(resp); return { ok: true }; } catch(e2) { e = e2; }
    }
    console.error('Save failed', e);
    const msg = e && e.code === 'invalid_argument'
      ? 'Your access to this page is view-only, so it can’t accept responses. Ask Simon for Contributor access.'
      : e && e.code === 'quota_exceeded'
      ? 'The response store is full. Ask Simon to clear old responses.'
      : 'Your response couldn’t be saved. Check your connection and try again.';
    return { ok: false, msg };
  }
}

async function clearAllResponses() {
  if (!db) { localWrite([]); allResponses = []; updateRespCount(); return; }
  const ids = allResponses.map(r => r._id).filter(Boolean);
  for (const id of ids) {
    try { await db.collection('responses').doc(id).delete(); } catch(e) { console.error('Delete failed', id, e); }
  }
}

function updateRespCount() {
  document.getElementById('resp-count').textContent = allResponses.length + ' response' + (allResponses.length !== 1 ? 's' : '');
}

// ─── TABS ────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-survey').className = 'nav-tab' + (tab==='survey'?' active':'');
  document.getElementById('tab-dashboard').className = 'nav-tab' + (tab==='dashboard'?' active':'');
  document.getElementById('view-survey').style.display = tab==='survey'?'':'none';
  document.getElementById('view-dashboard').style.display = tab==='dashboard'?'':'none';
  if(tab==='dashboard') renderDashboard();
}

// ─── SURVEY HELPERS ──────────────────────────────────────────────────────
function getStageAnswers(si) { return STAGES[si].questions.map((_,qi)=>answers[si+'-'+qi]||null); }
function allAnswered(si) { return getStageAnswers(si).every(a=>a!==null); }
function getStageScore(si) { const a=getStageAnswers(si); if(a.some(x=>x===null))return null; return a.reduce((s,x)=>s+x,0); }
function getMaxScore(si) { return STAGES[si].questions.length*5; }
function getScorePct(si) { const s=getStageScore(si); if(s===null)return 0; return Math.round((s/getMaxScore(si))*100); }
function getScoreLabel(pct) {
  if(pct>=80) return {label:"Strong",color:"#3d7a4f"};
  if(pct>=60) return {label:"Moderate",color:"#a8761a"};
  if(pct>=40) return {label:"Developing",color:"#bf5f2a"};
  return {label:"At Risk",color:"#b3392f"};
}
function getOverall() {
  let t=0,m=0;
  STAGES.forEach((_,i)=>{const s=getStageScore(i);if(s!==null){t+=s;m+=getMaxScore(i);}});
  if(!m)return null;
  return {score:t,max:m,pct:Math.round((t/m)*100)};
}
function totalProgress() {
  let a=0,t=0;
  STAGES.forEach((st,i)=>{t+=st.questions.length;a+=getStageAnswers(i).filter(x=>x!==null).length;});
  return {answered:a,total:t};
}
function getInterp(si,pct) {
  const d=[
    ["Genuine belonging present — people feel truly included.","Some inclusion, but belonging for certain individuals remains fragile.","Conditionally included — real connection is absent.","Significant exclusion risk. Belonging not established."],
    ["Learning actively encouraged. Mistakes are safe.","Learning present, but experimentation carries risk.","Questions and mistakes carry unspoken penalties.","Learner safety absent — people play it safe over growing."],
    ["Contributions trusted. People bring full capability.","People contribute but don't feel full ownership.","Contributions acknowledged but not truly valued.","People holding back — capability not being used."],
    ["Challenge welcomed. Team is genuinely innovative.","Some challenge tolerated but pushback feels risky.","Dissent uncomfortable — hard truths go unsaid.","Challenger safety absent. Problems will stay hidden."]
  ];
  const i=pct>=80?0:pct>=60?1:pct>=40?2:3;
  return d[si][i];
}
function getOverallInterp(pct) {
  if(pct>=80) return "Strong psychological safety across all four stages. Sustain the behaviours that got you here.";
  if(pct>=65) return "Solid foundation with room to grow — specific stages need targeted attention to unlock full performance.";
  if(pct>=50) return "Mixed safety profile. Critical gaps exist limiting candour, innovation, and retention.";
  return "Psychological safety significantly underdeveloped. Foundational inclusion and learner safety must be an immediate priority.";
}
function generateInsights() {
  const scores=STAGES.map((_,i)=>getScorePct(i));
  const ins=[];
  const minIdx=scores.indexOf(Math.min(...scores));
  ins.push(`Biggest gap: Stage ${STAGES[minIdx].id} — ${STAGES[minIdx].name} (${scores[minIdx]}%). Start here.`);
  if(scores[3]<60) ins.push("Challenger Safety is below threshold. Critical issues will go unvoiced — especially acute across ASEAN's high power-distance cultures.");
  if(scores[2]>=70&&scores[3]<60) ins.push("Contributors feel valued but won't push back. This 'polite high-performance' pattern caps innovation.");
  if(scores[0]<65) ins.push("Inclusion Safety is fragile. This foundation must strengthen before the stages above it can hold.");
  if(scores.every(s=>s>=75)) ins.push("All four stages strong. Sustain by actively modelling intellectual humility and public vulnerability as leader.");
  return ins;
}

// ─── SURVEY RENDER ───────────────────────────────────────────────────────
function renderSurvey() {
  const allDone=STAGES.every((_,i)=>allAnswered(i));
  if(allDone&&currentStage===STAGES.length) { renderPersonalResults(); return; }

  const {answered,total}=totalProgress();
  const stage=STAGES[currentStage];
  const sa=getStageAnswers(currentStage);
  const remaining=sa.filter(a=>a===null).length;

  const tabs=STAGES.map((s,i)=>{
    const cls=i===currentStage?'active':allAnswered(i)?'completed':'';
    return `<div class="stage-tab ${cls}"><span class="stage-dot"></span>${s.name}</div>`;
  }).join('');

  const qs=stage.questions.map((q,qi)=>{
    const val=answers[currentStage+'-'+qi];
    const btns=[1,2,3,4,5].map(n=>`<button class="scale-btn ${val===n?'selected':''}" onclick="pick(${currentStage},${qi},${n})" aria-pressed="${val===n}">${n}</button>`).join('');
    return `<div class="question-card ${val?'answered':''}">
      <div class="question-num">Question ${qi+1}</div>
      <div class="question-text">${q}</div>
      <div class="scale-options">${btns}</div>
      <div class="scale-row">
        <span class="scale-label">Strongly disagree</span>
        <span class="scale-label">Strongly agree</span>
      </div>
    </div>`;
  }).join('');

  const openCardHtml = `
    <div class="open-question-card">
      <div class="open-question-label">Your Ideas</div>
      <div class="open-question-text">${stage.openQuestion}</div>
      <textarea class="open-textarea" id="open-text-${currentStage}" placeholder="Optional — share any thoughts or suggestions anonymously…" oninput="saveComment(${currentStage}, this.value)">${comments[currentStage]||''}</textarea>
    </div>`;

  const canGo=allAnswered(currentStage);
  const isLast=currentStage===STAGES.length-1;

  document.getElementById('view-survey').innerHTML=`
    <div class="header">
      <h1>Simon's Team Psychological Safety Survey</h1>
      <p>Based on Timothy R. Clark's 4 Stages framework · ${total} questions · ~4 minutes · Anonymous</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${Math.round((answered/total)*100)}%"></div></div>
        <span class="progress-label">${answered} / ${total}</span>
      </div>
    </div>
    <div class="stage-tabs">${tabs}</div>
    <div class="content">
      <div class="stage-intro">
        <div class="stage-badge"><span class="stage-swatch" style="background:${stage.color}"></span>Stage ${stage.id} of ${STAGES.length}</div>
        <div class="stage-title">${stage.name}</div>
        <div class="stage-description">${stage.description}</div>
      </div>
      <div class="questions-list">${qs}${openCardHtml}</div>
      <div class="nav-row">
        <span class="questions-remaining">${remaining>0?`${remaining} question${remaining>1?'s':''} remaining`:'✓ All answered'}</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${currentStage>0?`<button class="btn btn-ghost" onclick="goBack()">← Back</button>`:''}
          <button class="btn btn-primary" onclick="goNext()" ${canGo?'':'disabled'}>${isLast?'See My Results →':'Next Stage →'}</button>
        </div>
      </div>
    </div>`;
}

function renderPersonalResults() {
  const overall=getOverall();
  const ol=getScoreLabel(overall.pct);
  const ins=generateInsights();

  const cards=STAGES.map((st,i)=>{
    const pct=getScorePct(i);
    const {label,color}=getScoreLabel(pct);
    const score=getStageScore(i);
    const max=getMaxScore(i);
    return `<div class="stage-result-card">
      <div class="stage-result-top">
        <div class="stage-result-name"><span class="stage-num-badge">Stage ${st.id}</span><span>${st.name}</span></div>
        <div class="score-display" style="color:${color}">${score}<span style="font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500"> / ${max}</span></div>
      </div>
      <div class="score-bar-track"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="score-interpretation"><span style="color:${color};font-weight:700">${label}</span> · ${pct}% — ${getInterp(i,pct)}</div>
    </div>`;
  }).join('');

  // Build response object
  const respData = {};
  STAGES.forEach((st,si)=>{
    st.questions.forEach((_,qi)=>{ respData[si+'-'+qi]=answers[si+'-'+qi]; });
  });
  const respComments = {};
  STAGES.forEach((_,si)=>{ if(comments[si]&&comments[si].trim()) respComments[si]=comments[si].trim(); });

  document.getElementById('view-survey').innerHTML=`
    <div class="header">
      <div class="header-row">
        <div><h1>Your Results</h1><p>Psychological Safety · 4 Stages Framework</p></div>
        <button class="btn btn-ghost btn-sm" onclick="restartSurvey()">Retake</button>
      </div>
    </div>
    <div class="results-wrap" style="padding-top:32px">
      <div class="overall-card">
        <div class="overall-score-circle" style="background:${ol.color}14;border:2px solid ${ol.color}">
          <div class="overall-score-number" style="color:${ol.color}">${overall.pct}%</div>
          <div class="overall-score-max">overall</div>
        </div>
        <div class="overall-text">
          <h3>Overall: ${ol.label}</h3>
          <p>${getOverallInterp(overall.pct)}</p>
        </div>
      </div>
      ${cards}
      <div class="insight-card">
        <h4>Key Insights</h4>
        <ul>${ins.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>
      <div class="submit-banner" id="submit-banner">
        <p>Your response is <strong>anonymous</strong>. Submitting adds it to the team dashboard so your leader can see aggregated patterns — not individual scores.</p>
        <button class="btn btn-primary" onclick="submitToTeam(${JSON.stringify(respData).replace(/"/g,'&quot;')}, ${JSON.stringify(respComments).replace(/"/g,'&quot;')})">Submit to Team Dashboard →</button>
      </div>
    </div>`;
}

async function submitToTeam(data, cmts) {
  const resp = {
    id: Date.now(),
    ts: new Date().toISOString(),
    answers: data,
    comments: cmts || {}
  };
  const banner = document.getElementById('submit-banner');
  const btn = banner.querySelector('.btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
  const res = await saveResponse(resp);
  if (!res.ok) {
    if (btn) { btn.disabled = false; btn.textContent = 'Try again →'; }
    let err = banner.querySelector('.submit-error');
    if (!err) { err = document.createElement('p'); err.className = 'submit-error'; banner.appendChild(err); }
    err.textContent = res.msg;
    return;
  }
  banner.innerHTML=`
    <p>✓ <strong>Submitted!</strong> ${res.local ? 'Your response is saved in this browser.' : 'Your anonymous response has been added to the team dashboard.'}</p>
    <button class="btn btn-ghost btn-sm" onclick="switchTab('dashboard')">View Dashboard →</button>`;
}

function saveComment(si, val) { comments[si] = val; }
function pick(si,qi,val){answers[si+'-'+qi]=val;renderSurvey();}
function goNext(){if(!allAnswered(currentStage))return;currentStage<STAGES.length-1?currentStage++:currentStage=STAGES.length;renderSurvey();window.scrollTo(0,0);}
function goBack(){if(currentStage>0){currentStage--;renderSurvey();window.scrollTo(0,0);}}
function restartSurvey(){answers={};comments={};currentStage=0;renderSurvey();}

// ─── DASHBOARD HELPERS ───────────────────────────────────────────────────
function heatColor(avg) {
  // 1=deep red → 3=amber → 5=green
  if(avg>=4.5) return '#2f6b42';
  if(avg>=4.0) return '#3d7a4f';
  if(avg>=3.5) return '#6b8a35';
  if(avg>=3.0) return '#a8761a';
  if(avg>=2.5) return '#bf5f2a';
  if(avg>=2.0) return '#b3392f';
  return '#8a2a22';
}
function heatBg(avg) { return heatColor(avg)+'1f'; }

function getQuestionAvg(si, qi) {
  if(!allResponses.length) return null;
  const vals = allResponses.map(r=>r.answers[si+'-'+qi]).filter(v=>v!=null);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function getStageAvg(si) {
  const avgs = STAGES[si].questions.map((_,qi)=>getQuestionAvg(si,qi)).filter(v=>v!==null);
  if(!avgs.length) return null;
  return avgs.reduce((a,b)=>a+b,0)/avgs.length;
}
function getTeamOverallAvg() {
  const avgs = STAGES.map((_,si)=>getStageAvg(si)).filter(v=>v!==null);
  if(!avgs.length) return null;
  return avgs.reduce((a,b)=>a+b,0)/avgs.length;
}
function avgToLabel(avg) {
  const pct = ((avg-1)/4)*100;
  return getScoreLabel(pct);
}

// ─── DASHBOARD RENDER ────────────────────────────────────────────────────
function renderDashboard() {
  const n = allResponses.length;
  const el = document.getElementById('view-dashboard');

  if(n===0) {
    el.innerHTML=`
      <div style="padding:0 16px">
        <div class="empty-state">
          <div class="icon">📊</div>
          <h3>No responses yet</h3>
          <p>Share the survey with your ASEAN CSM team. Once members complete and submit, their anonymous responses will appear here as an aggregated team heatmap.</p>
        </div>
      </div>`;
    return;
  }

  const teamAvg = getTeamOverallAvg();
  const {label:teamLabel, color:teamColor} = avgToLabel(teamAvg);
  const teamPct = Math.round(((teamAvg-1)/4)*100);

  // Summary tiles
  const stageAvgs = STAGES.map((_,si)=>getStageAvg(si));
  const minSi = stageAvgs.indexOf(Math.min(...stageAvgs));
  const maxSi = stageAvgs.indexOf(Math.max(...stageAvgs));

  const tilesHtml = `
    <div class="summary-tiles">
      <div class="tile">
        <div class="tile-label">RESPONSES</div>
        <div class="tile-value" style="color:var(--ink)">${n}</div>
        <div class="tile-sub">team members</div>
      </div>
      <div class="tile">
        <div class="tile-label">OVERALL SCORE</div>
        <div class="tile-value" style="color:${teamColor}">${teamAvg.toFixed(2)}<span style="font-family:var(--sans);font-size:14px;font-weight:500;color:var(--muted)"> /5</span></div>
        <div class="tile-sub">${teamLabel} · ${teamPct}%</div>
      </div>
      <div class="tile">
        <div class="tile-label">WEAKEST STAGE</div>
        <div class="tile-value small" style="color:#b3392f">${STAGES[minSi].name}</div>
        <div class="tile-sub">avg ${stageAvgs[minSi].toFixed(2)} / 5</div>
      </div>
      <div class="tile">
        <div class="tile-label">STRONGEST STAGE</div>
        <div class="tile-value small" style="color:#3d7a4f">${STAGES[maxSi].name}</div>
        <div class="tile-sub">avg ${stageAvgs[maxSi].toFixed(2)} / 5</div>
      </div>
    </div>`;

  // Heatmap grid
  const heatRows = STAGES.map((st,si)=>{
    return st.questions.map((q,qi)=>{
      const avg = getQuestionAvg(si,qi);
      if(avg===null) return '';
      const color = heatColor(avg);
      return `<div class="hm-row">
        <div class="hm-q-text">
          <span class="hm-stage-tag"><span class="stage-swatch" style="background:${st.color}"></span>${st.name}</span><br>${q}
        </div>
        <div class="hm-bar-track">
          <div style="height:100%;width:${((avg-1)/4)*100}%;background:${color};border-radius:99px"></div>
        </div>
        <div class="hm-avg" style="color:${color}">${avg.toFixed(2)}</div>
      </div>`;
    }).join('');
  }).join('');

  const heatmapHtml = `
    <div class="heatmap-wrap">
      <div class="hm-row hm-head">
        <div>Question</div>
        <div>Score Bar</div>
        <div style="text-align:right">Avg</div>
      </div>
      ${heatRows}
    </div>`;

  // Distribution bars per stage
  const distHtml = STAGES.map((st,si)=>{
    const avg = stageAvgs[si];
    const {label,color} = avgToLabel(avg);
    // count each value 1-5 across all questions in stage
    const counts=[0,0,0,0,0];
    const total = allResponses.length * st.questions.length;
    allResponses.forEach(r=>{
      st.questions.forEach((_,qi)=>{
        const v=r.answers[si+'-'+qi];
        if(v>=1&&v<=5) counts[v-1]++;
      });
    });
    const bars=[5,4,3,2,1].map(v=>{
      const c=counts[v-1];
      const pct=total?Math.round((c/total)*100):0;
      const barColor=heatColor(v);
      return `<div class="dist-bar-row">
        <div class="dist-bar-label">${v}</div>
        <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="dist-bar-count">${c}</div>
      </div>`;
    }).join('');
    return `<div class="dist-stage">
      <div class="dist-stage-header">
        <div class="dist-stage-name">
          <span class="stage-swatch" style="background:${st.color}"></span>
          ${st.name}
        </div>
        <div class="dist-avg-badge" style="background:${color}1a;color:${color}">${label} · ${avg.toFixed(2)}</div>
      </div>
      ${bars}
    </div>`;
  }).join('');

  // Response log
  const respRows = [...allResponses].reverse().slice(0,20).map((r,idx)=>{
    const stageScores = STAGES.map((_,si)=>{
      const avg=getQuestionAvg_resp(r,si);
      const {color}=avgToLabel(avg);
      return `<span class="score-pill" style="background:${color}1a;color:${color}">${avg.toFixed(1)}</span>`;
    }).join(' ');
    const date=new Date(r.ts).toLocaleDateString('en-SG',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    return `<tr>
      <td style="color:var(--muted)">#${allResponses.length-idx}</td>
      <td>${date}</td>
      <td>${stageScores}</td>
    </tr>`;
  }).join('');

  function getQuestionAvg_resp(r,si){
    const vals=STAGES[si].questions.map((_,qi)=>r.answers[si+'-'+qi]).filter(v=>v!=null);
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  }

  const teamInsights = buildTeamInsights(stageAvgs);

  const clearSection = (!isOwner && db) ? '' : `
    <div class="clear-row">
      <div id="clear-confirm" class="clear-confirm">
        Delete all ${n} responses permanently?
        <button class="btn btn-danger btn-sm" onclick="doClear()">Yes, delete</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelClear()">Cancel</button>
      </div>
      <div id="clear-btn-wrap">
        <button class="btn btn-danger btn-sm" onclick="showClearConfirm()">Clear all responses</button>
      </div>
    </div>`;

  el.innerHTML=`
    <div class="dash-wrap">
      <div class="dash-section-title">Team Overview</div>
      ${tilesHtml}

      <div class="dash-section-title">Question-Level Heatmap</div>
      ${heatmapHtml}

      <div class="dash-section-title">Response Distribution by Stage</div>
      <div class="dist-wrap">${distHtml}</div>

      <div class="dash-section-title">Team Insights</div>
      <div class="insight-card" style="margin-top:0">
        <h4>ASEAN CSM Team · Aggregated Signals</h4>
        <ul>${teamInsights.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>

      <div class="dash-section-title">Team Suggestions <span class="note">(anonymous open-text responses)</span></div>
      <div class="dist-wrap">${buildSuggestionsHtml()}</div>

      <div class="dash-section-title">Response Log <span class="note">(most recent first, anonymous)</span></div>
      <div class="resp-table-wrap">
        <table class="resp-table">
          <thead><tr><th>#</th><th>Submitted</th><th>Stage Scores (avg)</th></tr></thead>
          <tbody>${respRows}</tbody>
        </table>
      </div>
      ${clearSection}
    </div>`;
}

function buildSuggestionsHtml() {
  const hasAny = allResponses.some(r => r.comments && Object.keys(r.comments).length > 0);
  if (!hasAny) return `<div class="no-comments">No suggestions submitted yet.</div>`;

  return STAGES.map((st, si) => {
    const items = allResponses
      .map(r => r.comments && r.comments[si] ? r.comments[si] : null)
      .filter(Boolean);
    return `<div class="comments-stage">
      <div class="comments-stage-header">
        <span class="stage-swatch" style="background:${st.color};flex-shrink:0"></span>
        <div class="comments-stage-name">${st.name}</div>
        <div class="comment-count-badge">${items.length} suggestion${items.length!==1?'s':''}</div>
      </div>
      ${items.length
        ? items.map(c => `<div class="comment-item" style="border-left-color:${st.color}">${escHtml(c)}</div>`).join('')
        : `<div class="no-comments">No suggestions for this stage yet.</div>`
      }
    </div>`;
  }).join('');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildTeamInsights(avgs) {
  const ins=[];
  const pcts=avgs.map(a=>Math.round(((a-1)/4)*100));
  const minIdx=pcts.indexOf(Math.min(...pcts));
  ins.push(`Lowest stage across the team: Stage ${STAGES[minIdx].id} — ${STAGES[minIdx].name} (avg ${avgs[minIdx].toFixed(2)}/5). This is your priority intervention area.`);
  if(avgs[3]<3.0) ins.push("Challenger Safety avg is below 3.0 — a significant portion of the team does not feel safe to speak up or disagree. Leadership modelling is critical.");
  else if(avgs[3]<3.5) ins.push("Challenger Safety is developing but still fragile. Introduce structured dissent practices (pre-mortems, devil's advocate rotations) to normalise healthy pushback.");
  if(avgs[2]>=3.5&&avgs[3]<3.0) ins.push("Contributor Safety looks reasonable, but Challenger Safety lags significantly — people feel they can do their jobs but can't question direction. Common in high-performance APAC teams.");
  if(avgs[0]>=4.0) ins.push("Inclusion Safety is strong — the foundation is solid. Build on this by linking belonging explicitly to psychological safety in team communications.");
  if(avgs[1]<3.2) ins.push("Learner Safety is low — people are not admitting gaps or asking questions freely. Check whether performance management signals punish vulnerability.");
  if(avgs.every(a=>a>=3.8)) ins.push("All stages are tracking well. The next step is to use this baseline for quarterly pulse checks and watch for post-reorg or leadership-change regression.");
  return ins;
}

function showClearConfirm() {
  document.getElementById('clear-btn-wrap').style.display='none';
  document.getElementById('clear-confirm').style.display='flex';
}
function cancelClear() {
  document.getElementById('clear-btn-wrap').style.display='block';
  document.getElementById('clear-confirm').style.display='none';
}
async function doClear() {
  const yesBtn = document.querySelector('#clear-confirm .btn-danger');
  if (yesBtn) { yesBtn.disabled = true; yesBtn.textContent = 'Clearing…'; }
  await clearAllResponses();
  setTimeout(() => renderDashboard(), 80);
}

// ─── INIT ─────────────────────────────────────────────────────────────────
async function init() {
  await loadResponses();
  renderSurvey();
}

init();
</script>
