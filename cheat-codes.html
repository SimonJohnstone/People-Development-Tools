<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30 Life Cheat Codes</title>
  <style>
    :root {
      --bg:           #1a1520;
      --surface:      #231d2e;
      --card:         #2a2438;
      --accent:       #e05550;
      --text:         #e8e0f0;
      --text-muted:   #8880a0;
      --border:       #3a3248;
      --hassle-color: #4caf70;
      --resist-color: #e6a020;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Top nav bar */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      background: #120f1a;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title { flex: 1; min-width: 220px; }
    .topbar-title h1 { font-size: 20px; font-weight: 700; color: var(--accent); }
    .topbar-title p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .topbar-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

    .nav-link {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      padding: 9px 6px;
    }
    .nav-link:hover { color: var(--text); }

    .name-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }
    .name-input::placeholder { color: var(--text-muted); font-style: italic; }
    .name-input:focus { border-color: var(--accent); }

    .btn-export, .btn-reset {
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .btn-export { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
    .btn-export:hover { background: #c94540; border-color: #c94540; }
    .btn-reset { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); font-weight: 600; }
    .btn-reset:hover { background: var(--card); color: var(--text); }

    .page-content { padding: 28px 24px; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* Level section */
    .level {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .level-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
    }

    .level-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }
    .level-tag b { color: var(--accent); font-size: 13px; margin-left: 4px; }

    .level-header h2 {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      flex: 1;
    }

    .codes { display: flex; flex-direction: column; gap: 6px; padding: 10px; }

    .code {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      transition: border-color 0.2s, background 0.2s;
    }
    .code:hover { border-color: #5a5068; }

    .code-num {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      width: 22px;
      flex-shrink: 0;
    }

    .code-text { flex: 1; font-size: 12.5px; line-height: 1.45; }

    .code.pick-hassle { background: rgba(76,175,112,0.30); border-color: var(--hassle-color); }
    .code.pick-resist { background: rgba(230,160,32,0.30); border-color: var(--resist-color); }

    .pick-buttons { display: flex; gap: 4px; flex-shrink: 0; }

    .pick-btn {
      border: 1px solid rgba(255,255,255,0.3);
      background: transparent;
      color: #fff;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .pick-btn:hover:not(.active) { opacity: 0.65; }
    .pick-btn.active.hassle { background: var(--hassle-color); border-color: var(--hassle-color); }
    .pick-btn.active.resist { background: var(--resist-color); border-color: var(--resist-color); }

    /* Bonus level: Your Move */
    .bonus { border-color: var(--accent); }
    .bonus .level-tag b { font-size: 11px; }

    .bonus-intro { padding: 12px 16px 0; font-size: 12.5px; line-height: 1.5; color: var(--text-muted); }
    .bonus-intro strong { color: var(--text); }

    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }

    .slot {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slot.filled.hassle { border: 1px solid var(--hassle-color); }
    .slot.filled.resist { border: 1px solid var(--resist-color); }

    .slot-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
    .slot.hassle .slot-label { color: var(--hassle-color); }
    .slot.resist .slot-label { color: var(--resist-color); }

    .slot-code { font-size: 13px; line-height: 1.45; min-height: 38px; }
    .slot-code .num { font-family: ui-monospace, Menlo, monospace; color: var(--accent); font-weight: 700; margin-right: 6px; }
    .slot-code.empty { color: var(--text-muted); font-style: italic; font-size: 12px; }

    .slot textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      line-height: 1.4;
      resize: vertical;
      min-height: 54px;
      outline: none;
    }
    .slot textarea::placeholder { color: var(--text-muted); font-style: italic; }
    .slot textarea:focus { border-color: var(--accent); }

    .quote {
      padding: 0 16px 14px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-style: italic;
    }

    .credit {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .topbar, .page-content { padding-left: 16px; padding-right: 16px; }
      .name-input { width: 100%; }
      .topbar-controls { width: 100%; }
      .slots { grid-template-columns: 1fr; }
      .code { flex-wrap: wrap; }
      .pick-buttons { width: 100%; padding-left: 34px; }
    }

    /* ── Print / Export PDF ── */
    @media print {
      @page { size: A4 landscape; margin: 8mm; }

      body {
        background: #1a1520 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .topbar { display: none; }
      .page-content { padding: 0; }

      .page-content::before {
        content: attr(data-name);
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: #e05550;
        margin-bottom: 6px;
      }

      .layout { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
      .level { border-radius: 6px; break-inside: avoid; }
      .level-header { padding: 5px 9px; }
      .level-header h2 { font-size: 9.5px; letter-spacing: 1.2px; }
      .level-tag { font-size: 7px; }
      .level-tag b { font-size: 9px; }
      .codes { gap: 4px; padding: 6px; }
      .code { padding: 6px 7px; gap: 7px; border-radius: 4px; }
      .code-num { font-size: 10.5px; width: 17px; }
      .code-text { font-size: 10px; line-height: 1.35; }
      .pick-buttons { display: none; }

      .bonus { grid-column: span 1; }
      .bonus-intro { padding: 6px 9px 0; font-size: 9.5px; }
      .slots { grid-template-columns: 1fr; gap: 5px; padding: 6px; }
      .slot { padding: 6px; gap: 4px; }
      .slot-label { font-size: 8px; }
      .slot-code { font-size: 10.5px; min-height: 0; }
      .slot textarea { font-size: 10px; min-height: 0; padding: 4px 6px; resize: none; }
      .quote { padding: 0 9px 6px; font-size: 9px; }
      .credit { margin-top: 6px; font-size: 8px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-title">
      <h1>30 Life Cheat Codes</h1>
      <p>I wish I knew earlier — pick two and use both this week</p>
    </div>
    <div class="topbar-controls">
      <a class="nav-link" href="index.html">← Framework</a>
      <input class="name-input" id="nameInput" type="text" placeholder="Enter your name" />
      <button class="btn-export" id="exportBtn">Export PDF</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="page-content">
    <div class="layout" id="layout"></div>
    <p class="credit">Cheat codes by Daniel Pink · The Pink Report · danpink.com</p>
  </div>

  <script>
    const levels = [
      {
        name: 'Decisions',
        codes: [
          'Decide using an ordinary Tuesday, not a fantasy Saturday.',
          'For reversible decisions, decide fast.',
          'Ask, “What would change my mind?”',
          'Before deciding what to do, ask what happens if you do nothing.',
          'Make lots of small bets.',
          'Judge decisions by how you made them, not only by how they turned out.'
        ]
      },
      {
        name: 'People',
        codes: [
          'Before solving someone’s problem, ask what they want: advice, help, or company.',
          'Assume incompetence before malice.',
          'Notice who asks you questions.',
          'Don’t keep score in relationships you want to keep.',
          'Build an infrastructure for friendship.',
          'Eliminate toxic people (yes, even relatives).'
        ]
      },
      {
        name: 'Productivity',
        codes: [
          'Define “done” before you begin.',
          'Make the first step embarrassingly small.',
          'Let it be easy (use the rotisserie chicken).',
          'Prepare tomorrow’s first move tonight.',
          'Keep a “waiting for” list.',
          'Treat constant busyness as a warning, not a status symbol.'
        ]
      },
      {
        name: 'Work',
        codes: [
          'Send the recap email.',
          'Make your boss’s life easier.',
          'Ask for the deadline, then ask for the real deadline.',
          'Lead with a request and bring a recommendation.',
          'Get good at something valuable that everybody else avoids.',
          'Don’t be the boss you had. Be the boss you should have had.'
        ]
      },
      {
        name: 'Life',
        codes: [
          'Design your environment around your behavior.',
          'Spend money eliminating recurring misery before buying occasional pleasure.',
          'Create traditions on purpose.',
          'Stop trying to be normal.',
          'Compete with yourself, not with somebody else.',
          'Avoid unnecessary suffering. Accept necessary suffering.'
        ]
      }
    ];

    const slotDefs = [
      { key: 'hassle', btn: 'Hassle', label: 'Removes a hassle from my life', plan: 'How I’ll use it this week…' },
      { key: 'resist', btn: 'Resisting', label: 'The one I’ve been resisting', plan: 'How I’ll use it this week…' }
    ];

    const allCodes = [];               // { num, text, el }
    const picks = { hassle: null, resist: null };
    const layout = document.getElementById('layout');
    const pad = n => String(n).padStart(2, '0');

    let num = 0;
    levels.forEach((lvl, i) => {
      const section = document.createElement('div');
      section.className = 'level';
      section.innerHTML = `
        <div class="level-header">
          <span class="level-tag">LEVEL<b>${i + 1}</b></span>
          <h2>${lvl.name}</h2>
        </div>
        <div class="codes"></div>`;
      const list = section.querySelector('.codes');

      lvl.codes.forEach(text => {
        num++;
        const code = { num, text };
        const row = document.createElement('div');
        row.className = 'code';
        row.innerHTML = `<span class="code-num">${pad(num)}</span><span class="code-text"></span><div class="pick-buttons"></div>`;
        row.querySelector('.code-text').textContent = text;

        const btns = row.querySelector('.pick-buttons');
        slotDefs.forEach(s => {
          const b = document.createElement('button');
          b.className = `pick-btn ${s.key}`;
          b.textContent = s.btn;
          b.title = s.label;
          b.addEventListener('click', () => pick(s.key, code));
          btns.appendChild(b);
        });

        code.el = row;
        allCodes.push(code);
        list.appendChild(row);
      });

      layout.appendChild(section);
    });

    // Bonus level
    const bonus = document.createElement('div');
    bonus.className = 'level bonus';
    bonus.innerHTML = `
      <div class="level-header">
        <span class="level-tag">BONUS LEVEL<b>■</b></span>
        <h2>Your Move</h2>
      </div>
      <p class="bonus-intro">Cheat codes only work if you enter them. <strong>Don’t try all 30.</strong> Pick two and use both this week.</p>
      <div class="slots">
        ${slotDefs.map(s => `
          <div class="slot ${s.key}" id="slot-${s.key}">
            <span class="slot-label">${s.label}</span>
            <div class="slot-code empty">Choose “${s.btn}” on a code</div>
            <textarea placeholder="${s.plan}" rows="2"></textarea>
          </div>`).join('')}
      </div>
      <p class="quote">“Life has cheat codes too. It’s just that nobody ever hands you the list.” — Daniel Pink</p>`;
    layout.appendChild(bonus);

    function pick(slot, code) {
      const other = slot === 'hassle' ? 'resist' : 'hassle';
      if (picks[slot] === code) {
        picks[slot] = null;                         // toggle off
      } else {
        if (picks[other] === code) picks[other] = null;  // one code, one slot
        picks[slot] = code;
      }
      render();
    }

    function render() {
      allCodes.forEach(c => {
        c.el.classList.toggle('pick-hassle', picks.hassle === c);
        c.el.classList.toggle('pick-resist', picks.resist === c);
        c.el.querySelector('.pick-btn.hassle').classList.toggle('active', picks.hassle === c);
        c.el.querySelector('.pick-btn.resist').classList.toggle('active', picks.resist === c);
      });
      slotDefs.forEach(s => {
        const slot = document.getElementById(`slot-${s.key}`);
        const out = slot.querySelector('.slot-code');
        const c = picks[s.key];
        slot.classList.toggle('filled', !!c);
        if (c) {
          out.classList.remove('empty');
          out.innerHTML = `<span class="num">#${pad(c.num)}</span>`;
          out.appendChild(document.createTextNode(c.text));
        } else {
          out.classList.add('empty');
          out.textContent = `Choose “${s.btn}” on a code`;
        }
      });
    }

    // Reset
    document.getElementById('resetBtn').addEventListener('click', () => {
      picks.hassle = picks.resist = null;
      document.querySelectorAll('.slot textarea').forEach(t => t.value = '');
      document.getElementById('nameInput').value = '';
      render();
    });

    // Export PDF
    document.getElementById('exportBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      const heading = name ? `${name} — 30 Life Cheat Codes` : '30 Life Cheat Codes';
      const content = document.querySelector('.page-content');
      const originalTitle = document.title;
      content.setAttribute('data-name', heading);
      document.title = heading;
      window.print();
      document.title = originalTitle;
    });
  </script>

</body>
</html>
